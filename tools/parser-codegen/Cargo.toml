[package]
name = "mini-c-parser-codegen"
version = "0.1.0"
edition = "2021"
publish = false

# A separate workspace, excluded from mini-c's ordinary Cargo resolution.
[workspace]
resolver = "2"

# This optional tool generates an external-token parser; normal builds never compile it.
[dependencies]
lalrpop = { version = "=0.23.1", default-features = false }