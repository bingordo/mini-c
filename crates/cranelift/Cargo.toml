[package]
name = "mini-c-cranelift"
version = "0.1.0"
edition = "2021"

[features]
default = ["internal-cpp"]
internal-cpp = ["mini-c-preprocess/internal-rcc"]

[dependencies]
mini-c-syntax = { path = "../syntax" }
mini-c-sema = { path = "../sema" }
mini-c-preprocess = { path = "../preprocess" }
cranelift-codegen = "0.136.3"
cranelift-frontend = "0.136.3"
cranelift-module = "0.136.3"
cranelift-object = "0.136.3"
cranelift-native = "0.136.3"
# Append small SysV GP-only variadic tail thunks to Cranelift's ELF object.
object = { version = "0.40", default-features = false, features = ["write", "elf", "std"] }

[dev-dependencies]
# Shared with cranelift-object, for inspecting emitted ELF relocations.
object = { version = "0.40", default-features = false, features = ["read", "elf", "std"] }
