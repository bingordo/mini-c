name: Regenerate char-literal expression parser
on:
  push:
    branches: ['feature/c-char-literals-s9']
    paths:
      - '.github/workflows/char-literal-regenerate.yml'
permissions:
  contents: write
concurrency:
  group: mini-c-char-regenerate
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: parser-codegen-0.23
      - name: Regenerate checked-in parser from grammar
        run: cargo run --quiet --manifest-path tools/parser-codegen/Cargo.toml -- --write
      - name: Run targeted scanner and expression parser tests
        run: cargo test -q -p mini-c-syntax
      - name: Commit generated parser as a separate non-handwritten artifact
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntax/src/grammar.rs
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate parser from char literal grammar"
            git push origin HEAD:feature/c-char-literals-s9
          fi
