name: Mini-C syntax
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/syntax.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Syntax tests
        run: cargo test -p mini-c-syntax -p mini-c-preprocess
      - name: CLI and preprocessing integration tests
        run: cargo test -p mini-c
      - name: Deterministic fuzzer tests
        run: cargo test -p mini-c-fuzz
      - name: GCC reference smoke
        run: |
          for seed in 0 1 2 3 4 5 6 7; do
            cargo run -q -p mini-c-fuzz -- "$seed" 100 > /tmp/mini-c-fuzz-case.c
            cc -std=c11 -O2 /tmp/mini-c-fuzz-case.c -o /tmp/mini-c-fuzz-reference
            set +e
            /tmp/mini-c-fuzz-reference
            status=$?
            set -e
            if [ "$status" -ne 1 ]; then echo "reference mismatch seed=$seed exit=$status"; exit 1; fi
          done
      - name: Clippy
        run: cargo clippy -p mini-c-syntax -p mini-c-preprocess -p mini-c -p mini-c-fuzz --all-targets -- -D warnings
