name: Mini-C syntax
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '!crates/cranelift/**'
      - 'tools/**'
      - '.github/workflows/syntax.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '!crates/cranelift/**'
      - 'tools/**'
      - '.github/workflows/syntax.yml'
  workflow_dispatch:

# A new commit supersedes queued/active checks for the same branch or PR.
concurrency:
  group: mini-c-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Unlike rust-cache, preserve and reuse workspace incremental objects.
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Use runner-provided Rust toolchain
        id: rust
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          echo "release=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      - name: Restore incremental Rust builds and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mini-c-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-
            mini-c-${{ runner.os }}-${{ steps.rust.outputs.release }}-
      - name: Workspace tests (single Cargo invocation)
        run: cargo test -p mini-c-syntax -p mini-c-preprocess -p mini-c-sema -p mini-c -p mini-c-fuzz
      - name: Assert the normal syntax dependency tree excludes the parser generator and regex lexer
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p mini-c-syntax --edges normal,build --prefix none --offline > /tmp/mini-c-syntax-deps.txt
          if grep -Eq '^(lalrpop|regex|regex-automata) v[0-9]' /tmp/mini-c-syntax-deps.txt; then
            cat /tmp/mini-c-syntax-deps.txt
            echo 'Unexpected parser generator or regex dependency in normal syntax builds' >&2
            exit 1
          fi
      - name: Python reference harness tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Clippy
        run: cargo clippy -p mini-c-syntax -p mini-c-preprocess -p mini-c-sema -p mini-c -p mini-c-fuzz --all-targets -- -D warnings
      - name: Build reusable generator executable
        run: cargo build -p mini-c-fuzz
      - name: Fast GCC/Clang smoke (four seeds, two builds each)
        run: python3 tools/fuzz_reference.py --seed-count 4 --steps 120 --smoke
      - name: Retain only failed fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-fuzz-failures
          path: target/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14
