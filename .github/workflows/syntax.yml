name: Mini-C syntax
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/syntax.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Syntax tests
        run: cargo test -p mini-c-syntax -p mini-c-preprocess
      - name: CLI and preprocessing integration tests
        run: cargo test -p mini-c
      - name: Deterministic fuzzer tests
        run: cargo test -p mini-c-fuzz
      - name: Reference harness unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Build fuzz generator
        run: cargo build -p mini-c-fuzz
      - name: GCC and Clang reference smoke
        run: python3 tools/fuzz_reference.py --seed-count 8 --steps 120
      - name: Upload failed fuzz cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-fuzz-failures
          path: target/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Clippy
        run: cargo clippy -p mini-c-syntax -p mini-c-preprocess -p mini-c -p mini-c-fuzz --all-targets -- -D warnings
