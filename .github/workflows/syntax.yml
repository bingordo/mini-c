name: Mini-C syntax
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/syntax.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and commit source files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo fmt --all
          if ! git diff --quiet -- '*.rs'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git commit -m 'Apply cargo fmt to Rust sources'
            git push
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Syntax tests
        run: cargo test -p mini-c-syntax -p mini-c-preprocess
      - name: Clippy
        run: cargo clippy -p mini-c-syntax -p mini-c-preprocess --all-targets -- -D warnings
