name: Mini-C Cranelift executable
on:
  push:
    branches: [main]
    paths:
      # Exercise native codegen whenever one of its local dependencies changes.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/cranelift/**'
      - 'crates/syntax/**'
      - 'crates/sema/**'
      - 'crates/fuzz/**'
      - 'tools/test_cranelift.py'
      - 'tools/test_switch_native.py'
      - 'tools/test_musl_s9_native.py'
      - 'tests/fixtures/musl-s9/**'
      - '.github/workflows/cranelift.yml'
  pull_request:
    branches: [main]
    paths:
      # Exercise native codegen whenever one of its local dependencies changes.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/cranelift/**'
      - 'crates/syntax/**'
      - 'crates/sema/**'
      - 'crates/fuzz/**'
      - 'tools/test_cranelift.py'
      - 'tools/test_switch_native.py'
      - 'tools/test_musl_s9_native.py'
      - 'tests/fixtures/musl-s9/**'
      - '.github/workflows/cranelift.yml'
  workflow_dispatch:

concurrency:
  group: mini-c-cranelift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Use runner Rust binaries
        id: rust
        run: |
          rustc --version
          cargo --version
          echo "release=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache native backend dependencies and build products
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mini-c-native-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-
            mini-c-native-${{ runner.os }}-${{ steps.rust.outputs.release }}-
      - name: Targeted Cranelift backend tests
        run: cargo test -p mini-c-cranelift
      - name: Clippy backend
        run: cargo clippy -p mini-c-cranelift --all-targets -- -D warnings
      - name: Build reusable backend and fuzzer executables
        run: cargo build -p mini-c-cranelift -p mini-c-fuzz
      - name: Compare emitted ELF executables with GCC
        run: python3 tools/test_cranelift.py --seed-count 4 --steps 100
      - name: C99 _Bool native conversion and storage acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bool.c" <<'EOF'
          _Bool global_true = 256;
          _Bool global_false = 0;
          int nonnull(_Bool b) { return b; }
          _Bool pointer_truth(int *p) { return p; }
          int main(void) {
              int value = 5;
              int *pointer = &value;
              _Bool from_pointer = pointer;
              _Bool pointer_cast = (_Bool)pointer;
              _Bool from_null = (int*)0;
              _Bool reassigned = 0;
              reassigned = pointer;
              _Bool local_true = 2;
              _Bool local_from_int = (_Bool)256;
              _Bool local_false = 0;
              return !(sizeof(_Bool) == 1
                  && global_true == 1 && global_false == 0
                  && local_true == 1 && local_from_int == 1
                  && local_false == 0
                  && local_from_int + 1 == 2
                  && from_pointer == 1 && pointer_cast == 1
                  && from_null == 0 && reassigned == 1
                  && nonnull(pointer) == 1
                  && pointer_truth(pointer) == 1);
          }
          EOF
          cc -std=c99 "$RUNNER_TEMP/bool.c" -o "$RUNNER_TEMP/bool-gcc"
          target/debug/mini-c-cranelift --emit-obj "$RUNNER_TEMP/bool.o" "$RUNNER_TEMP/bool.c"
          cc "$RUNNER_TEMP/bool.o" -o "$RUNNER_TEMP/bool-mini"
          "$RUNNER_TEMP/bool-gcc"
          "$RUNNER_TEMP/bool-mini"
      - name: C99 _Bool stdbool.h arrays and structure layout versus GCC
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stdbool.c" <<'EOF'
          #include <stdbool.h>
          struct Flags { bool active; int count; bool ready; };
          int main(void) {
              struct Flags f;
              bool flags[3];
              f.active=256; f.count=17; f.ready=false;
              flags[0]=false; flags[1]=256; flags[2]=true;
              bool valid=true;
              return !(sizeof(bool)==1 && sizeof f==12 && sizeof(struct Flags)==12
                  && sizeof(flags)==3 && valid==true
                  && f.active==true && f.count==17 && f.ready==false
                  && flags[0]==false && flags[1]==true && flags[2]==true);
          }
          EOF
          cc -std=c99 "$RUNNER_TEMP/stdbool.c" -o "$RUNNER_TEMP/stdbool-gcc"
          target/debug/mini-c-cranelift --emit-obj "$RUNNER_TEMP/stdbool.o" "$RUNNER_TEMP/stdbool.c"
          cc "$RUNNER_TEMP/stdbool.o" -o "$RUNNER_TEMP/stdbool-mini"
          "$RUNNER_TEMP/stdbool-gcc"
          "$RUNNER_TEMP/stdbool-mini"
      - name: Source-pinned C99 switch native execution against GCC
        run: python3 tools/test_switch_native.py --backend target/debug/mini-c-cranelift
      - name: Compare exact pinned musl S9 objects with GCC
        run: python3 tools/test_musl_s9_native.py
      - name: Preserve S9 object differential summary and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-s9-native-differential
          path: |
            target/s9-musl-native-summary.json
            target/s9-musl-native-failures/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain only failing Cranelift reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-cranelift-reproducers
          path: target/cranelift-failures/
          if-no-files-found: ignore
          retention-days: 14
