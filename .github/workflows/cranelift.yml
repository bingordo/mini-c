name: Mini-C Cranelift executable
on:
  push:
    branches: [main]
    paths:
      # Exercise native codegen whenever one of its local dependencies changes.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/cranelift/**'
      - 'crates/syntax/**'
      - 'crates/sema/**'
      - 'crates/fuzz/**'
      - 'tools/test_cranelift.py'
      - '.github/workflows/cranelift.yml'
  pull_request:
    branches: [main]
    paths:
      # Exercise native codegen whenever one of its local dependencies changes.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/cranelift/**'
      - 'crates/syntax/**'
      - 'crates/sema/**'
      - 'crates/fuzz/**'
      - 'tools/test_cranelift.py'
      - '.github/workflows/cranelift.yml'
  workflow_dispatch:

concurrency:
  group: mini-c-cranelift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Use runner Rust binaries
        id: rust
        run: |
          rustc --version
          cargo --version
          echo "release=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache native backend dependencies and build products
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mini-c-native-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}-
            mini-c-native-${{ runner.os }}-${{ steps.rust.outputs.release }}-
      - name: Targeted Cranelift backend tests
        run: cargo test -p mini-c-cranelift
      - name: Clippy backend
        run: cargo clippy -p mini-c-cranelift --all-targets -- -D warnings
      - name: Build reusable backend and fuzzer executables
        run: cargo build -p mini-c-cranelift -p mini-c-fuzz
      - name: Compare emitted ELF executables with GCC
        run: python3 tools/test_cranelift.py --seed-count 4 --steps 100
      - name: Retain only failing Cranelift reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-cranelift-reproducers
          path: target/cranelift-failures/
          if-no-files-found: ignore
          retention-days: 14
