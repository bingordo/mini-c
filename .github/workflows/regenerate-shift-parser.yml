name: Regenerate checked-in shift expression parser
on:
  push:
    branches: ['review/shift-operators-current-main']
    paths:
      - 'crates/syntax/src/grammar.lalrpop'
      - '.github/workflows/regenerate-shift-parser.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'crates/syntax/src/grammar.lalrpop'
      - '.github/workflows/regenerate-shift-parser.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mini-c-regenerate-shift-parser
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/shift-operators-current-main
          persist-credentials: true
      - name: Generate parser from editable LALRPOP grammar
        run: cargo run --manifest-path tools/parser-codegen/Cargo.toml -- --write
      - name: Commit generated grammar.rs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntax/src/grammar.rs
          if ! git diff --cached --quiet; then
            git commit -m 'gen(syntax): regenerate shift-expression parser'
            git push origin HEAD:review/shift-operators-current-main
          fi
