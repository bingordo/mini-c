name: Regenerate inc-dec LALRPOP parser
on:
  push:
    branches: ['review/increment-decrement-20261102']
    paths:
      - 'crates/syntax/src/grammar.lalrpop'
      - '.github/workflows/regenerate-inc-dec-parser.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'crates/syntax/src/grammar.lalrpop'
      - '.github/workflows/regenerate-inc-dec-parser.yml'
permissions:
  contents: write
concurrency:
  group: mini-c-regenerate-inc-dec-parser
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/increment-decrement-20261102
          persist-credentials: true
      - name: Regenerate checked-in LALRPOP parser
        run: cargo run --manifest-path tools/parser-codegen/Cargo.toml -- --write
      - name: Commit generated output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/syntax/src/grammar.rs
          if ! git diff --cached --quiet; then
            git commit -m 'gen: increment decrement expression parser'
            git push origin HEAD:review/increment-decrement-20261102
          fi
